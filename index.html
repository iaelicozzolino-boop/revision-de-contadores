<style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #14181f;
      --text-dim: #6b7480;
      --border: #e1e5ea;
      --accent: #2563eb;
      --green: #16a34a;
      --section-header: #eef1f5;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      box-sizing: border-box;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14171c;
        --card-bg: #1c2026;
        --text: #eef1f5;
        --text-dim: #9aa3b0;
        --border: #2b3138;
        --section-header: #232830;
      }
    }

    :root[data-theme="dark"] {
      --bg: #14171c;
      --card-bg: #1c2026;
      --text: #eef1f5;
      --text-dim: #9aa3b0;
      --border: #2b3138;
      --section-header: #232830;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    header h1 {
      padding: 14px 16px 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .header-banner {
      display: block;
      width: 100%;
      height: auto;
    }

    .date-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      background: var(--section-header);
      border-top: 1px solid var(--border);
    }

    .date-bar label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .date-bar input[type="date"] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      min-width: 0;
    }

    main {
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .pier-section {
      margin-bottom: 8px;
    }

    .pier-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--section-header);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
      width: 100%;
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
    }

    .pier-toggle:active {
      background: var(--border);
    }

    .pier-toggle.expanded {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .chevron {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: transform 0.2s;
    }

    .pier-toggle.expanded .chevron {
      transform: rotate(90deg);
    }

    .berths-container {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .berths-container.open {
      display: block;
    }

    .berth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .berth-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .berth-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .status-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .status-btn {
      flex: 1;
      padding: 6px 8px;
      border: 2px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .status-btn.active {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }


    .input-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .field-input {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      font-family: "Monaco", "Courier New", monospace;
    }

    .field-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .actions {
      padding: 16px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:active {
      transform: scale(0.98);
      opacity: 0.8;
    }

    .btn-secondary {
      background: var(--section-header);
      color: var(--text);
    }

    .btn-secondary:active {
      transform: scale(0.98);
      opacity: 0.8;
    }

    .status-message {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    @media (max-width: 600px) {
      .berth-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-wrap: wrap;
        padding: 10px 16px;
      }

      .actions .status-message {
        flex-basis: 100%;
        padding: 0;
        min-height: 16px;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <style>
    .add-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .add-row {
      display: flex;
      gap: 8px;
      position: relative;
    }
    .add-row .field-input {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      text-transform: uppercase;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .suggestions:empty { display: none; }
    .sugg {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-family: "Monaco", "Courier New", monospace;
      font-size: 14px;
      font-weight: 600;
    }
    .sugg:active { background: var(--border); }
    .sugg[disabled] { opacity: 0.45; cursor: default; }
    .add-hint {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
      min-height: 18px;
    }
    .add-hint.error { color: #dc2626; }
    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 4px 2px 10px;
      font-weight: 600;
    }
    .list-head span { font-size: 12px; color: var(--text-dim); font-weight: 600; }
    .berth-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .berth-top .berth-name { margin-bottom: 0; font-size: 16px; }
    .remove-btn {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12px;
    }
    .remove-btn.confirm {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }
    .mode-bar {
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    .send-panel {
      margin-top: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .send-panel textarea {
      width: 100%;
      min-height: 110px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }
    .send-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .send-buttons > * { flex: 1; text-align: center; }
    [hidden] { display: none !important; }
    .actions { flex-wrap: wrap; }
    .actions .status-message { flex-basis: 100%; }
    .clear-bar {
      flex-basis: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px 12px;
      padding: 10px 12px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--section-header);
      font-weight: 600;
      color: var(--text);
    }
    .clear-buttons { display: flex; gap: 8px; }
    .clear-buttons button { flex: 0 0 auto !important; padding: 8px 14px; }
    .app-version { flex-basis: 100%; text-align: center; font-size: 10px; color: var(--text-dim); order: 99; }
    .btn-danger { background: #dc2626; color: #fff; }
    .clear-buttons .btn-secondary { background: var(--card-bg); border: 1px solid var(--border); }
    .input-group { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .input-group .field-input { width: 100%; min-width: 0; }
    .berth-grid { grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); }
    .note-card { margin-top: 14px; margin-bottom: 0; }
    .note-input {
      width: 100%;
      min-height: 90px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      resize: vertical;
    }
    .mail-input { font-family: inherit; font-size: 15px; }
    .import-note { margin-top: 6px; font-weight: 600; white-space: pre-wrap; }
    .send-preview {
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--section-header);
      color: var(--text);
    }
    .btn-link {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      background: var(--green);
      color: #fff;
    }
    .import-banner {
      background: var(--section-header);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 28px 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: 13px;

  <style id="marina-theme">
    /* Marina Ibiza Design: modo claro, Manrope, azul marino #1F3A68, bordes 1px, sin sombras en tarjetas */
    :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
      color-scheme: light;
      --mi-navy: #1F3A68;
      --mi-gray-50: #F4F6F8;
      --mi-gray-200: #E1E5EA;
      --mi-gray-500: #6B7480;
      --mi-gray-900: #14181F;
      --surface-pressed: #E3E8EF;
      --focus-ring: #E1E9F4;
      --danger-bg: #FBECEC;
      --danger-fg: #A3282B;
      --font-sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;

      /* tokens que ya usa la app, ahora con los valores de la marca */
      --bg: #FFFFFF;
      --card-bg: #FFFFFF;
      --text: var(--mi-gray-900);
      --text-dim: var(--mi-gray-500);
      --border: var(--mi-gray-200);
      --accent: var(--mi-navy);
      --green: var(--mi-navy);
      --section-header: var(--mi-gray-50);
    }

    body {
      background: #fff;
      color: var(--text);
      font-family: var(--font-sans);
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font-family: var(--font-sans); }

    /* Cabecera: logo centrado + etiqueta, sin foto */
    header {
      background: #fff;
      border-bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 28px 16px 8px;
    }
    .brand-logo { width: min(220px, 60vw); height: auto; display: block; }
    header h1.kicker {
      padding: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .date-bar {
      margin-top: 14px;
      width: 100%;
      max-width: 960px;
      background: transparent;
      border-top: 0;
      padding: 0;
    }
    .date-bar label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .date-bar input[type="date"] {
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      font: 500 16px var(--font-sans);
      color: var(--text);
    }
    .mode-bar {
      margin: 12px 16px 0;
      width: calc(100% - 32px);
      max-width: 928px;
      background: var(--mi-navy);
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    main { max-width: 960px; padding: 20px 16px 24px; }

    /* Tarjetas y paneles: borde 1px, radio 16, sin sombra */
    .add-card, .send-panel, .note-card, .berth-card, .import-banner, .empty-state {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: none;
    }
    .add-card, .send-panel { padding: 16px; }
    .send-panel { gap: 14px; }
    .berth-card { padding: 14px; }
    .berth-grid { gap: 10px; }
    .empty-state { border-style: dashed; color: var(--text-dim); font-size: 13px; }
    .import-banner {
      background: var(--mi-gray-50);
      border-color: var(--border);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.5;
    }
    .import-note { color: var(--mi-navy); }

    /* Cabecera de lista al estilo de las secciones del hub: punto + nombre + línea */
    .list-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text);
    }
    .list-head::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--mi-navy);
      flex: none;
      order: -1;
    }
    .list-head::after { content: ""; flex: 1; height: 1px; background: var(--border); order: 1; }
    .list-head span { order: 2; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: none; color: var(--text-dim); }

    /* Etiquetas en mayúsculas */
    .field-label, .send-panel .field-label, .note-card .field-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* Campos: 48px, radio 12, foco azul marino con anillo */
    .field-input, .note-input, .send-panel textarea, .mail-input {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: 500 16px var(--font-sans);
      font-variant-numeric: tabular-nums;
    }
    .field-input { height: 48px; padding: 0 14px; }
    .note-input, .send-panel textarea { padding: 12px 14px; }
    .add-row .field-input { text-transform: uppercase; }
    .field-input:focus, .note-input:focus, .send-panel textarea:focus, .date-bar input[type="date"]:focus {
      outline: none;
      border-color: var(--mi-navy);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }
    .field-input::placeholder, .note-input::placeholder, textarea::placeholder { color: #A3AAB4; }
    .send-preview {
      background: var(--mi-gray-50);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
    }

    /* Nombre del amarre */
    .berth-name, .berth-top .berth-name { font-size: 16px; font-weight: 700; letter-spacing: .02em; }
    .input-group { gap: 6px 10px; }

    /* Botones: 44px, radio 12, 700 14px */
    button, a.btn-link, .btn-link {
      height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      font: 700 14px var(--font-sans);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .15s, opacity .15s;
    }
    .btn-primary { background: var(--mi-navy); color: #fff; }
    .btn-secondary, .btn-link { background: var(--mi-gray-50); color: var(--text); }
    .btn-danger { background: var(--danger-bg); color: var(--danger-fg); }
    @media (hover: hover) {
      .btn-secondary:hover, .btn-link:hover { background: var(--surface-pressed); }
      .btn-primary:hover { background: #163055; }
    }
    .btn-primary:active, .btn-secondary:active, .btn-link:active, .btn-danger:active { transform: none; opacity: .6; }
    button:focus-visible, a:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus-ring), 0 0 0 1px var(--mi-navy); }

    /* Pulsador Ocupado */
    .status-btn {
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
      font: 700 13px var(--font-sans);
    }
    .status-btn.active { background: var(--mi-navy); border-color: var(--mi-navy); color: #fff; }

    /* Quitar: botón fantasma pequeño; al confirmar, peligro */
    .remove-btn {
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 9px;
      background: var(--mi-gray-50);
      color: var(--text-dim);
      font: 700 12px var(--font-sans);
    }
    .remove-btn.confirm { background: var(--danger-bg); border: 0; color: var(--danger-fg); }

    /* Sugerencias del buscador */
    .sugg {
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--mi-navy);
      font: 700 14px var(--font-sans);
      font-variant-numeric: tabular-nums;
    }
    .sugg:active { background: var(--surface-pressed); }
    .add-hint { font-size: 13px; font-weight: 600; }
    .add-hint.error { color: var(--danger-fg); }

    /* Barra inferior: flotante, como la barra del hub */
    .actions {
      position: sticky;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      margin: 0 16px 16px;
      max-width: 928px;
      background: #fff;
      border: 1px solid var(--border);
      border-top: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 10px 30px rgba(20, 24, 31, .2);
      gap: 8px;
    }
    @media (min-width: 960px) { .actions { margin-left: auto; margin-right: auto; } }
    .status-message { font-size: 13px; font-weight: 600; color: var(--text-dim); padding: 0; }
    .status-message:empty { display: none; }
    .app-version { font-size: 10px; font-weight: 600; letter-spacing: .08em; color: #A3AAB4; padding-top: 2px; }

    /* Aviso de vaciar / deshacer */
    .clear-bar {
      border: 0;
      border-radius: 14px;
      background: var(--mi-navy);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }
    .clear-buttons .btn-danger { background: #fff; color: var(--danger-fg); }
    .clear-buttons .btn-secondary { background: rgba(255, 255, 255, .14); color: #fff; border: 0; }
    .clear-buttons button { height: 40px; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>

    <h1 class="kicker">Revisión de contadores</h1>

      <label for="readingDate">Fecha:</label>

  <main>
    <div class="import-banner" id="importBanner" hidden></div>
    <div class="add-card" id="addCard">

        <input class="field-input" id="berthInput" type="text" placeholder="Ej. F07, H29 B, K56" autocapitalize="characters" enterkeyhint="done">
        <button class="btn-primary" type="submit">Añadir</button>
      </form>
      <div class="suggestions" id="suggestions"></div>

    <div class="add-card note-card" id="noteCard" hidden>
      <label class="field-label" for="receptionNote">Nota para la recepción</label>
      <textarea class="note-input" id="receptionNote" placeholder="Ej. El contador del F07 está roto, no se puede leer"></textarea>
    </div>

    <div class="send-panel" id="sendPanel" hidden>
      <label class="field-label" for="sendNote">Nota para el marinero (opcional)</label>
      <textarea id="sendNote" placeholder="Ej. Revisar antes de las 12, el F07 marca raro"></textarea>
      <div class="field-label">Mensaje que se enviará</div>
      <div class="send-preview" id="sendPreview"></div>
      <label class="field-label" for="mailTo">Email del marinero</label>

        <button class="btn-secondary" id="gmailBtn" type="button">Abrir en Gmail</button>
      </div>
      <div class="send-buttons">
        <button class="btn-link" id="waBtn" type="button">WhatsApp</button>
        <button class="btn-secondary" id="copyBtn" type="button">Copiar mensaje</button>
        <button class="btn-secondary" id="shareBtn" type="button" hidden>Compartir</button>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script>
    // ---------- Lista maestra de amarres (plantilla de contadores + extras de "Listado de Contadores") ----------
    const range = (p, a, b) => Array.from({ length: b - a + 1 }, (_, i) => p + String(a + i).padStart(2, '0'));
    const insertAfter = (arr, after, item) => { const i = arr.indexOf(after); arr.splice(i + 1, 0, item); return arr; };

    const PIERS = {
      A: range('A', 1, 34).reverse(),
      B: range('B', 1, 36),
      C: range('C', 1, 39),
      D: range('D', 1, 16),
      E: range('E', 1, 17),
      F: insertAfter(range('F', 1, 55), 'F07', 'F07 B'),
      G: range('G', 1, 16).reverse(),
      H: insertAfter(insertAfter(range('H', 1, 38), 'H29', 'H29 B'), 'H38', 'H38 B'),
      I: insertAfter(insertAfter(range('I', 1, 38), 'I37', 'I37 B'), 'I38', 'I38 B'),
      J: range('J', 1, 14),
      K: [...range('K', 1, 56), 'K56 B'],
      L: range('L', 1, 28),
      M: range('M', 1, 9)
    };
    const MASTER = Object.values(PIERS).flat();
    const ORDER = new Map(MASTER.map((b, i) => [b, i]));
    const compact = s => s.toUpperCase().replace(/\s+/g, '');
    const BY_COMPACT = new Map(MASTER.map(b => [compact(b), b]));

    // "f7" -> "F07", "h29b" -> "H29 B"
    function canonical(q) {
      const c = compact(q);
      const m = c.match(/^([A-Z])0*(\d{1,2})(B?)$/);
      if (m) return BY_COMPACT.get(m[1] + m[2].padStart(2, '0') + m[3]) || null;
      return BY_COMPACT.get(c) || null;
    }

    function suggest(q) {
      const c = compact(q);
      if (!c) return [];
      const exact = canonical(q);
      const m = c.match(/^([A-Z])0*(\d*)(B?)$/);
      const out = MASTER.filter(b => {
        const bc = compact(b);
        if (bc.startsWith(c)) return true;
        if (m && m[2]) {
          // "F1" tambien propone F10..F19 y F01
          const num = bc.slice(1).replace(/^0+/, '');
          return bc[0] === m[1] && num.startsWith(m[2]) && (!m[3] || bc.endsWith('B'));
        }
        return false;
      });
      if (exact && !out.includes(exact)) out.unshift(exact);
      if (exact) { out.splice(out.indexOf(exact), 1); out.unshift(exact); }
      return out.slice(0, 10);
    }

    // ---------- Estado y guardado ----------
    function localToday() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    const dateInput = document.getElementById('readingDate');
    dateInput.value = localToday();
    let currentDate = dateInput.value;
    let state = { berths: [], readings: {} };
    let RECEPCION = false;

    // Enlace base para los mensajes de recepción
    const ARTIFACT_URL = 'https://claude.ai/artifact/GcM96P2FkxPj9cVRAcViDb';
    // En GitHub Pages la lista viaja como ?lista=...; dentro de Claude solo funciona #r-...
    const ON_WEB = /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname);
    const BASE_URL = ON_WEB ? location.origin + location.pathname : ARTIFACT_URL;

    const key = d => `${RECEPCION ? 'recepcion' : 'revision'}_${d}`;
    function store(d, s) { try { localStorage.setItem(key(d), JSON.stringify(s)); return true; } catch (e) { return false; } }
    function fetchState(d) {
      try {
        const raw = localStorage.getItem(key(d));
        if (raw) {
          const s = JSON.parse(raw);
          return { berths: (s.berths || []).filter(b => ORDER.has(b)), readings: s.readings || {}, note: s.note || '' };
        }
      } catch (e) {}
      return { berths: [], readings: {}, note: '' };
    }
    // Borra listas de más de 7 días
    function cleanup() {
      try {
        const limit = new Date(); limit.setDate(limit.getDate() - 7);
        const lim = limit.toISOString().slice(0, 10);
        Object.keys(localStorage).forEach(k => {
          const m = k.match(/^(revision|recepcion)_(\d{4}-\d{2}-\d{2})$/);
          if (m && m[2] < lim) localStorage.removeItem(k);
        });
      } catch (e) {}
    }

    function notify(msg, ms = 4000) {
      const el = document.getElementById('statusMessage');
      el.textContent = msg;
      clearTimeout(notify.t);
      notify.t = setTimeout(() => { el.textContent = ''; }, ms);
    }
    // ---------- Vaciar la orden tras enviarla, con Deshacer ----------
    let lastOrder = null, undoTimer = null, clearMode = '';
    function askClear(text) {
      if (!state.berths.length && !(state.note || '').trim()) return;
      clearMode = 'ask';
      document.getElementById('clearText').textContent = text;
      document.getElementById('clearYes').textContent = 'Vaciar';
      document.getElementById('clearYes').className = 'btn-danger';
      document.getElementById('clearNo').hidden = false;
      document.getElementById('clearBar').hidden = false;
    }
    function hideClearBar() {
      clearTimeout(undoTimer);
      clearMode = '';
      document.getElementById('clearBar').hidden = true;
    }
    function clearOrder() {
      lastOrder = { date: currentDate, state: JSON.parse(JSON.stringify(state)),
                    sendNote: document.getElementById('sendNote').value };
      state = { berths: [], readings: {}, note: '' };
      document.getElementById('sendNote').value = '';
      document.getElementById('importBanner').hidden = true;
      autosave();
      render();
      clearMode = 'undo';
      document.getElementById('clearText').textContent = 'Orden vaciada';
      document.getElementById('clearYes').textContent = 'Deshacer';
      document.getElementById('clearYes').className = 'btn-secondary';
      document.getElementById('clearNo').hidden = true;
      document.getElementById('clearBar').hidden = false;
      clearTimeout(undoTimer);
      undoTimer = setTimeout(() => { lastOrder = null; hideClearBar(); }, 10000);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function undoClear() {
      if (!lastOrder) { hideClearBar(); return; }
      currentDate = lastOrder.date;
      dateInput.value = currentDate;
      state = lastOrder.state;
      document.getElementById('sendNote').value = lastOrder.sendNote;
      lastOrder = null;
      autosave();
      render();
      hideClearBar();
      notify('✓ Orden recuperada');
    }
    document.getElementById('clearYes').addEventListener('click', () => {
      if (clearMode === 'undo') undoClear(); else clearOrder();
    });
    document.getElementById('clearNo').addEventListener('click', hideClearBar);

    function hint(msg, isError) {
      const el = document.getElementById('addHint');
      el.textContent = msg || '';
      el.classList.toggle('error', !!isError);
    }

    const autosave = () => store(currentDate, state);
    function saveData() {
      if (store(currentDate, state)) notify('✓ Datos guardados');
      else notify('No se pudo guardar en este navegador');
    }

    // ---------- Añadir / quitar ----------
    const input = document.getElementById('berthInput');
    const suggBox = document.getElementById('suggestions');

    function addBerth(code) {
      if (state.berths.includes(code)) { hint(`${code} ya está en la lista`, true); return; }
      state.berths.push(code);
      state.berths.sort((a, b) => ORDER.get(a) - ORDER.get(b));
      if (!state.readings[code]) state.readings[code] = { light: '', water: '', occupied: false };
      autosave();
      input.value = '';
      suggBox.innerHTML = '';
      hint(`✓ ${code} añadido`);
      render();
      const card = document.getElementById(`card_${cssId(code)}`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function removeBerth(code) {
      state.berths = state.berths.filter(b => b !== code);
      delete state.readings[code];
      autosave();
      render();
      notify(`${code} quitado`);
    }

    function renderSuggestions() {
      const q = input.value;
      suggBox.innerHTML = '';
      if (!compact(q)) { hint(''); return; }
      const list = suggest(q);
      if (!list.length) { hint(`"${q.toUpperCase()}" no existe en el puerto`, true); return; }
      hint('');
      list.forEach(b => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sugg';
        btn.textContent = b;
        if (state.berths.includes(b)) { btn.disabled = true; btn.title = 'Ya añadido'; }
        btn.onclick = () => { addBerth(b); input.focus(); };
        suggBox.appendChild(btn);
      });
    }
    input.addEventListener('input', renderSuggestions);

    document.getElementById('addForm').addEventListener('submit', e => {
      e.preventDefault();
      const q = input.value;
      if (!compact(q)) return;
      const exact = canonical(q);
      if (exact) { addBerth(exact); return; }
      const list = suggest(q).filter(b => !state.berths.includes(b));
      if (list.length === 1) { addBerth(list[0]); return; }
      if (list.length > 1) { hint('Hay varios amarres posibles: toca el correcto', true); return; }
      hint(`"${q.toUpperCase()}" no existe en el puerto`, true);
    });

    // ---------- Pintar la lista ----------
    const cssId = b => b.replace(/\s+/g, '_');

    function render() {
      const list = document.getElementById('berthList');
      list.innerHTML = '';
      const n = state.berths.length;
      document.getElementById('emptyState').hidden = n > 0;
      document.getElementById('listHead').hidden = n === 0;
      document.getElementById('berthCount').textContent = `${n} ${n === 1 ? 'amarre' : 'amarres'}`;
      document.getElementById('sendPanel').hidden = !RECEPCION;
      document.getElementById('noteCard').hidden = RECEPCION;
      if (RECEPCION) updatePreview();
      document.getElementById('receptionNote').value = state.note || '';

      state.berths.forEach(berth => {
        const r = state.readings[berth] || (state.readings[berth] = { light: '', water: '', occupied: false });
        const card = document.createElement('div');
        card.className = 'berth-card';
        card.id = `card_${cssId(berth)}`;

        const top = document.createElement('div');
        top.className = 'berth-top';
        const name = document.createElement('div');
        name.className = 'berth-name';
        name.textContent = berth;
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'remove-btn';
        rm.textContent = 'Quitar';
        rm.onclick = () => {
          if (rm.classList.contains('confirm')) { removeBerth(berth); return; }
          rm.classList.add('confirm');
          rm.textContent = '¿Seguro?';
          setTimeout(() => { rm.classList.remove('confirm'); rm.textContent = 'Quitar'; }, 3000);
        };
        top.append(name, rm);
        card.appendChild(top);
        if (RECEPCION) { top.style.marginBottom = '0'; list.appendChild(card); return; }

        const statusButtons = document.createElement('div');
        statusButtons.className = 'status-buttons';
        const occ = document.createElement('button');
        occ.type = 'button';
        occ.className = 'status-btn' + (r.occupied ? ' active' : '');
        occ.textContent = 'Ocupado';
        occ.onclick = () => { r.occupied = !r.occupied; occ.classList.toggle('active', r.occupied); autosave(); };
        statusButtons.appendChild(occ);
        card.appendChild(statusButtons);

        const group = document.createElement('div');
        group.className = 'input-group';
        [['Luz', 'light'], ['Agua', 'water']].forEach(([label, k]) => {
          const l = document.createElement('label');
          l.className = 'field-label';
          l.textContent = label;
          l.htmlFor = `${k}_${cssId(berth)}`;
          group.appendChild(l);
        });
        [['light'], ['water']].forEach(([k]) => {
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.inputMode = 'decimal';
          inp.className = 'field-input';
          inp.id = `${k}_${cssId(berth)}`;
          inp.placeholder = '0.000';
          inp.value = r[k] || '';
          inp.addEventListener('input', () => { r[k] = inp.value.trim(); autosave(); });
          group.appendChild(inp);
        });
        card.appendChild(group);
        list.appendChild(card);
      });
    }

    dateInput.addEventListener('change', () => {
      autosave();
      if (!dateInput.value) { dateInput.value = currentDate; return; }
      currentDate = dateInput.value;
      hideClearBar(); lastOrder = null;
      state = fetchState(currentDate);
      render();
      renderSuggestions();
    });

    // ---------- PDF ----------
    function formatDate(iso) {
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    function buildPdf() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const W = doc.internal.pageSize.getWidth();
      let y = 18;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('Revisión de Contadores', W / 2, y, { align: 'center' });
      y += 10;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);
      doc.text(`Fecha de lectura: ${formatDate(currentDate)}`, 14, y);
      y += 4;

      const rows = state.berths.map(b => {
        const r = state.readings[b] || {};
        return [b, r.occupied ? 'Sí' : 'No', r.light || '0', r.water || '0'];
      });
      doc.autoTable({
        startY: y + 4,
        head: [['Amarre', 'Ocupado', 'Luz', 'Agua']],
        body: rows,
        theme: 'grid',
        styles: { fontSize: 10, cellPadding: 2 },
        headStyles: { fillColor: [31, 58, 104], textColor: 255 },
        columnStyles: {
          0: { cellWidth: 34 },
          1: { cellWidth: 34, halign: 'center' },
          2: { cellWidth: 57, halign: 'right' },
          3: { cellWidth: 57, halign: 'right' }
        },
        didParseCell: (d) => {
          if (d.section === 'head') d.cell.styles.halign = ['left', 'center', 'right', 'right'][d.column.index];
        },
        margin: { left: 14, right: 14 }
      });

      const note = (state.note || '').trim();
      if (note) {
        let ny = doc.lastAutoTable.finalY + 10;
        const lines = doc.splitTextToSize(note, W - 28);
        if (ny + 8 + lines.length * 5 > 280) { doc.addPage(); ny = 20; }
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(12);
        doc.text('Nota para la recepción:', 14, ny);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);
        doc.text(lines, 14, ny + 7);
      }

      const pages = doc.getNumberOfPages();
      doc.setFontSize(9);
      for (let i = 1; i <= pages; i++) {
        doc.setPage(i);
        doc.text(`Página ${i} de ${pages}`, W - 14, 290, { align: 'right' });
      }
      return doc.output('blob');
    }

    // Orden: 1) menú de compartir del móvil; 2) capacidad "downloads" de Claude; 3) descarga normal.
    async function deliverPdf(blob, filename) {
      const file = new File([blob], filename, { type: 'application/pdf' });
      let why = '';
      if (!navigator.share || !navigator.canShare) {
        why = 'no está disponible en este navegador';
      } else if (!navigator.canShare({ files: [file] })) {
        why = 'no admite compartir archivos aquí';
      } else {
        try {
          await navigator.share({ files: [file], title: filename });
          return { via: 'shared' };
        } catch (e) {
          if (e && e.name === 'AbortError') return { via: 'declined' };
          why = (e && e.name === 'NotAllowedError') ? 'está bloqueado en este entorno' : `falló (${e && e.name})`;
        }
      }
      try {
        const dl = window.claude && await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data: blob }); return { via: 'saved', why }; }
      } catch (e) {
        if (e && e.code === 'declined') return { via: 'declined' };
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      return { via: 'downloaded', why };
    }

    async function createPdf() {
      if (!(window.jspdf && window.jspdf.jsPDF)) { notify('No se pudo cargar el generador de PDF. Comprueba la conexión.'); return; }
      if (!state.berths.length) { notify('Añade al menos un amarre para crear el PDF'); return; }
      autosave();
      try {
        const blob = buildPdf();
        const r = await deliverPdf(blob, `Revision_Contadores_${currentDate}.pdf`);
        if (r.via === 'shared') notify('✓ PDF listo para compartir');
        else if (r.via !== 'declined') notify(`PDF guardado en el móvil. El menú de compartir ${r.why}.`, 9000);
        askClear('¿PDF enviado? Vacía la app para la próxima orden');
      } catch (e) {
        notify('Error al crear el PDF');
        console.error(e);
      }
    }

    document.getElementById('pdfBtn').addEventListener('click', createPdf);
    document.getElementById('saveBtn').addEventListener('click', saveData);

    // ---------- Recepción: preparar y enviar la lista ----------
    function listLink() {
      const code = currentDate.replace(/-/g, '') + '-' + state.berths.map(compact).join('-');
      if (!ON_WEB) return `${BASE_URL}#r-${code}`;
      const note = document.getElementById('sendNote').value.trim();
      return `${BASE_URL}?lista=${code}` + (note ? `&nota=${encodeURIComponent(note)}` : '');
    }
    const mailSubject = () => `Revisión de contadores ${formatDate(currentDate)}: ${state.berths.join(', ')}`;
    function buildMessage() {
      const note = document.getElementById('sendNote').value.trim();
      return `Amarres para revisar contadores (${formatDate(currentDate)}):\n` +
        `${state.berths.join(', ')}\n` +
        (note ? `\n${note}\n` : '') +
        `\nAbre este enlace y se cargan solos en la app:\n${listLink()}`;
    }
    function updatePreview() {
      document.getElementById('sendPreview').textContent = state.berths.length
        ? buildMessage()
        : 'Añade al menos un amarre para preparar el mensaje.';
    }
    function openExternal(url) {
      let w = null;
      try { w = window.open(url, '_blank', 'noopener'); } catch (e) {}
      // Con 'noopener' algunos navegadores devuelven null aunque abran la pestaña; no salimos de la app
      if (!w && !document.hidden) setTimeout(() => {
        if (!document.hidden) notify('Si no se abrió la pestaña, permite las ventanas emergentes para esta página', 8000);
      }, 1200);
    }
    function needList() {
      if (state.berths.length) return false;
      notify('Añade al menos un amarre antes de enviar');
      document.getElementById('berthInput').focus();
      return true;
    }
    document.getElementById('sendNote').addEventListener('input', updatePreview);

    // Email del marinero: se recuerda en este ordenador
    const mailInput = document.getElementById('mailTo');
    try { mailInput.value = localStorage.getItem('revision_mailTo') || ''; } catch (e) {}
    mailInput.addEventListener('input', () => { try { localStorage.setItem('revision_mailTo', mailInput.value.trim()); } catch (e) {} });

    document.getElementById('mailBtn').addEventListener('click', () => {
      if (needList()) return;
      const to = mailInput.value.trim();
      location.href = `mailto:${encodeURIComponent(to).replace(/%40/g, '@')}` +
        `?subject=${encodeURIComponent(mailSubject())}&body=${encodeURIComponent(buildMessage())}`;
      notify('Si no se abre el correo, usa "Abrir en Gmail" o "Copiar mensaje"', 8000);
      askClear('¿Orden enviada? Vacía la lista para una nueva');
    });

    document.getElementById('gmailBtn').addEventListener('click', () => {
      if (needList()) return;
      const url = 'https://mail.google.com/mail/?view=cm&fs=1' +
        `&to=${encodeURIComponent(mailInput.value.trim())}` +
        `&su=${encodeURIComponent(mailSubject())}&body=${encodeURIComponent(buildMessage())}`;
      openExternal(url);
      askClear('¿Orden enviada? Vacía la lista para una nueva');
    });

    document.getElementById('waBtn').addEventListener('click', () => {
      if (needList()) return;
      const url = 'https://wa.me/?text=' + encodeURIComponent(buildMessage());
      openExternal(url);
      askClear('¿Orden enviada? Vacía la lista para una nueva');
    });

    document.getElementById('sendBtn').addEventListener('click', () => {
      if (needList()) return;
      document.getElementById('sendPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      if (needList()) return;
      const msg = buildMessage();
      const fallback = () => {
        const r = document.createRange(); r.selectNodeContents(document.getElementById('sendPreview'));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        notify('Texto seleccionado: cópialo con el menú del móvil');
      };
      try {
        navigator.clipboard.writeText(msg).then(() => notify('✓ Mensaje copiado'), fallback);
      } catch (e) { fallback(); }
      askClear('¿Orden enviada? Vacía la lista para una nueva');
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      if (needList()) return;
      try { await navigator.share({ text: buildMessage() }); askClear('¿Orden enviada? Vacía la lista para una nueva'); }
      catch (e) { if (!e || e.name !== 'AbortError') notify('No se pudo abrir el menú de compartir. Usa WhatsApp o Copiar.'); }
    });

    // ---------- Marinero: cargar la lista que llega en el enlace ----------
    function importFromHash() {
      // Acepta ?lista=20261018-F07-H29B y el formato antiguo #r-20261018-F07.H29B
      let raw = null;
      try { raw = new URLSearchParams(location.search).get('lista'); } catch (e) {}
      if (!raw) { const h = location.hash.match(/^#r-(.+)$/); if (h) raw = h[1]; }
      if (!raw) return false;
      const m = decodeURIComponent(raw).trim().match(/^(\d{4})(\d{2})(\d{2})[-.]([A-Za-z0-9.\- ]+)$/);
      const banner = document.getElementById('importBanner');
      if (!m) {
        banner.textContent = 'El enlace de recepción está incompleto o dañado. Pide que te lo vuelvan a enviar.';
        banner.hidden = false;
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
        return false;
      }
      const date = `${m[1]}-${m[2]}-${m[3]}`;
      const codes = m[4].split(/[.\- ]+/).filter(Boolean);
      const valid = [], unknown = [];
      codes.forEach(c => { const b = BY_COMPACT.get(c.toUpperCase()); (b ? valid : unknown).push(b || c); });

      currentDate = date;
      dateInput.value = date;
      state = fetchState(date);
      let added = 0;
      valid.forEach(b => {
        if (state.berths.includes(b)) return;
        state.berths.push(b);
        state.readings[b] = state.readings[b] || { light: '', water: '', occupied: false };
        added++;
      });
      state.berths.sort((a, b) => ORDER.get(a) - ORDER.get(b));
      autosave();

      let txt = `Lista de recepción (${formatDate(date)}): ${valid.join(', ') || 'ningún amarre válido'}. `;
      txt += added ? `${added} ${added === 1 ? 'amarre nuevo añadido' : 'amarres nuevos añadidos'}.` : 'Ya los tenías todos.';
      if (unknown.length) txt += ` Códigos no reconocidos: ${unknown.join(', ')}.`;
      banner.textContent = txt;
      let nota = null;
      try { nota = new URLSearchParams(location.search).get('nota'); } catch (e) {}
      if (nota && nota.trim()) {
        const n = document.createElement('div');
        n.className = 'import-note';
        n.textContent = `Nota de recepción: ${nota.trim()}`;
        banner.appendChild(n);
        try { localStorage.setItem(`revision_nota_${date}`, nota.trim()); } catch (e) {}
      }
      banner.hidden = false;

      // Quita el código del enlace para que al recargar no se vuelva a aplicar
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      return true;
    }

    function applyMode() {
      document.getElementById('modeBar').hidden = !RECEPCION;
      document.getElementById('pdfBtn').hidden = RECEPCION;
      document.getElementById('saveBtn').hidden = RECEPCION;
      document.getElementById('sendBtn').hidden = !RECEPCION;
      document.getElementById('shareBtn').hidden = !navigator.share;
      document.getElementById('addCard').hidden = !RECEPCION;
      document.getElementById('emptyState').textContent = RECEPCION
        ? 'Escribe los amarres que hay que revisar y pulsa Enviar lista.'
        : 'Todavía no hay amarres. Abre el enlace que te manda recepción.';
    }

    document.getElementById('receptionNote').addEventListener('input', e => {
      state.note = e.target.value;
      autosave();
    });

    function boot() {
      RECEPCION = location.hash === '#recepcion';
      document.getElementById('importBanner').hidden = true;
      applyMode();
      if (RECEPCION || !importFromHash()) state = fetchState(currentDate);
      render();
    }
    window.addEventListener('hashchange', boot);

    cleanup();
    boot();
  </script>

</body>
