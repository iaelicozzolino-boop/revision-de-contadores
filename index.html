<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisión de Contadores</title>
<style>
    :root {
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #14181f;
      --text-dim: #6b7480;
      --border: #e1e5ea;
      --accent: #2563eb;
      --green: #16a34a;
      --section-header: #eef1f5;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      box-sizing: border-box;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14171c;
        --card-bg: #1c2026;
        --text: #eef1f5;
        --text-dim: #9aa3b0;
        --border: #2b3138;
        --section-header: #232830;
      }
    }

    :root[data-theme="dark"] {
      --bg: #14171c;
      --card-bg: #1c2026;
      --text: #eef1f5;
      --text-dim: #9aa3b0;
      --border: #2b3138;
      --section-header: #232830;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    header h1 {
      padding: 14px 16px 10px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .header-banner {
      display: block;
      width: 100%;
      height: auto;
    }

    .date-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      background: var(--section-header);
      border-top: 1px solid var(--border);
    }

    .date-bar label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .date-bar input[type="date"] {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      min-width: 0;
    }

    main {
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .pier-section {
      margin-bottom: 8px;
    }

    .pier-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--section-header);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
      width: 100%;
      font-weight: 600;
      color: var(--text);
      font-size: 14px;
    }

    .pier-toggle:active {
      background: var(--border);
    }

    .pier-toggle.expanded {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .chevron {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: transform 0.2s;
    }

    .pier-toggle.expanded .chevron {
      transform: rotate(90deg);
    }

    .berths-container {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 6px 6px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .berths-container.open {
      display: block;
    }

    .berth-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .berth-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .berth-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .status-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .status-btn {
      flex: 1;
      padding: 6px 8px;
      border: 2px solid var(--border);
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .status-btn.active {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }


    .input-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .field-input {
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      font-family: "Monaco", "Courier New", monospace;
    }

    .field-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .actions {
      padding: 16px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      position: sticky;
      bottom: 0;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:active {
      transform: scale(0.98);
      opacity: 0.8;
    }

    .btn-secondary {
      background: var(--section-header);
      color: var(--text);
    }

    .btn-secondary:active {
      transform: scale(0.98);
      opacity: 0.8;
    }

    .status-message {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    @media (max-width: 600px) {
      .berth-grid {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-wrap: wrap;
        padding: 10px 16px;
      }

      .actions .status-message {
        flex-basis: 100%;
        padding: 0;
        min-height: 16px;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <style>
    .add-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .add-row {
      display: flex;
      gap: 8px;
      position: relative;
    }
    .add-row .field-input {
      flex: 1;
      min-width: 0;
      font-size: 16px;
      text-transform: uppercase;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .suggestions:empty { display: none; }
    .sugg {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-family: "Monaco", "Courier New", monospace;
      font-size: 14px;
      font-weight: 600;
    }
    .sugg:active { background: var(--border); }
    .sugg[disabled] { opacity: 0.45; cursor: default; }
    .add-hint {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
      min-height: 18px;
    }
    .add-hint.error { color: #dc2626; }
    .list-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 4px 2px 10px;
      font-weight: 600;
    }
    .list-head span { font-size: 12px; color: var(--text-dim); font-weight: 600; }
    .berth-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .berth-top .berth-name { margin-bottom: 0; font-size: 16px; }
    .remove-btn {
      padding: 4px 10px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12px;
    }
    .remove-btn.confirm {
      background: #dc2626;
      border-color: #dc2626;
      color: #fff;
    }
    .mode-bar {
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }
    .send-panel {
      margin-top: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .send-panel textarea {
      width: 100%;
      min-height: 110px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
    }
    .send-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .send-buttons > * { flex: 1; text-align: center; }
    .mail-input { font-family: inherit; font-size: 15px; }
    .import-note { margin-top: 6px; font-weight: 600; white-space: pre-wrap; }
    .send-preview {
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--section-header);
      color: var(--text);
    }
    .btn-link {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      background: var(--green);
      color: #fff;
    }
    .import-banner {
      background: var(--section-header);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 28px 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      font-size: 13px;
    }
  </style>

      <label for="readingDate">Fecha:</label>

  <main>
    <div class="import-banner" id="importBanner" hidden></div>
    <div class="add-card">
      <div class="field-label">Añadir amarre a revisar</div>
      <form class="add-row" id="addForm" autocomplete="off">
        <input class="field-input" id="berthInput" type="text" placeholder="Ej. F07, H29 B, K56" autocapitalize="characters" enterkeyhint="done">
        <button class="btn-primary" type="submit">Añadir</button>
      </form>
      <div class="suggestions" id="suggestions"></div>
      <div class="add-hint" id="addHint"></div>
    </div>

    <div class="list-head" id="listHead" hidden>Amarres a revisar <span id="berthCount"></span></div>
    <div class="berth-grid" id="berthList"></div>
    <div class="empty-state" id="emptyState">Todavía no hay amarres. Escribe el código del amarre que pide recepción y pulsa Añadir.</div>

    <div class="send-panel" id="sendPanel" hidden>
      <label class="field-label" for="sendNote">Nota para el marinero (opcional)</label>
      <textarea id="sendNote" placeholder="Ej. Revisar antes de las 12, el F07 marca raro"></textarea>
      <div class="field-label">Mensaje que se enviará</div>
      <div class="send-preview" id="sendPreview"></div>
      <label class="field-label" for="mailTo">Email del marinero</label>
      <input class="field-input mail-input" id="mailTo" type="email" inputmode="email" autocomplete="email" placeholder="marinero@ejemplo.com">
      <div class="send-buttons">
        <button class="btn-primary" id="mailBtn" type="button">Enviar por email</button>
        <button class="btn-secondary" id="gmailBtn" type="button">Abrir en Gmail</button>
      </div>
      <div class="send-buttons">
        <button class="btn-link" id="waBtn" type="button">WhatsApp</button>
        <button class="btn-secondary" id="copyBtn" type="button">Copiar mensaje</button>
        <button class="btn-secondary" id="shareBtn" type="button" hidden>Compartir</button>
      </div>
    </div>
  </main>

  <div class="actions">
    <div class="status-message" id="statusMessage"></div>
    <button class="btn-secondary" id="pdfBtn" type="button">Crear PDF</button>
    <button class="btn-primary" id="saveBtn" type="button">Guardar Datos</button>
    <button class="btn-primary" id="sendBtn" type="button" hidden>Enviar lista</button>
  </div>

  <script>
    // ---------- Lista maestra de amarres (plantilla de contadores + extras de "Listado de Contadores") ----------
    const range = (p, a, b) => Array.from({ length: b - a + 1 }, (_, i) => p + String(a + i).padStart(2, '0'));
    const insertAfter = (arr, after, item) => { const i = arr.indexOf(after); arr.splice(i + 1, 0, item); return arr; };

    const PIERS = {
      A: range('A', 1, 34).reverse(),
      B: [...range('B', 1, 32), 'B34', 'B36'],
      C: [...range('C', 1, 34), 'C36', 'C37', 'C39'],
      D: range('D', 1, 16),
      E: range('E', 1, 17),
      F: insertAfter(range('F', 1, 55), 'F07', 'F07 B'),
      G: range('G', 1, 16).reverse(),
      H: insertAfter(insertAfter([...range('H', 1, 30), 'H32', 'H34', 'H36', 'H38'], 'H29', 'H29 B'), 'H38', 'H38 B'),
      I: insertAfter(insertAfter(range('I', 1, 38), 'I37', 'I37 B'), 'I38', 'I38 B'),
      J: range('J', 1, 14),
      K: range('K', 1, 56),
      L: ['L01','L03','L05','L07','L09','L11','L13','L15','L17','L19','L21','L23','L25','L27','L28','L26','L24','L22','L20','L18','L16','L14','L12','L10','L08','L06'],
      M: range('M', 5, 9)
    };
    const MASTER = Object.values(PIERS).flat();
    const ORDER = new Map(MASTER.map((b, i) => [b, i]));
    const compact = s => s.toUpperCase().replace(/\s+/g, '');
    const BY_COMPACT = new Map(MASTER.map(b => [compact(b), b]));

    // "f7" -> "F07", "h29b" -> "H29 B"
    function canonical(q) {
      const c = compact(q);
      const m = c.match(/^([A-Z])0*(\d{1,2})(B?)$/);
      if (m) return BY_COMPACT.get(m[1] + m[2].padStart(2, '0') + m[3]) || null;
      return BY_COMPACT.get(c) || null;
    }

    function suggest(q) {
      const c = compact(q);
      if (!c) return [];
      const exact = canonical(q);
      const m = c.match(/^([A-Z])0*(\d*)(B?)$/);
      const out = MASTER.filter(b => {
        const bc = compact(b);
        if (bc.startsWith(c)) return true;
        if (m && m[2]) {
          // "F1" tambien propone F10..F19 y F01
          const num = bc.slice(1).replace(/^0+/, '');
          return bc[0] === m[1] && num.startsWith(m[2]) && (!m[3] || bc.endsWith('B'));
        }
        return false;
      });
      if (exact && !out.includes(exact)) out.unshift(exact);
      if (exact) { out.splice(out.indexOf(exact), 1); out.unshift(exact); }
      return out.slice(0, 10);
    }

    // ---------- Estado y guardado ----------
    function localToday() {
      const d = new Date();
      const p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    const dateInput = document.getElementById('readingDate');
    dateInput.value = localToday();
    let currentDate = dateInput.value;
    let state = { berths: [], readings: {} };
    let RECEPCION = false;

    // Enlace base para los mensajes de recepción
    const ARTIFACT_URL = 'https://claude.ai/artifact/GcM96P2FkxPj9cVRAcViDb';
    // En GitHub Pages la lista viaja como ?lista=...; dentro de Claude solo funciona #r-...
    const ON_WEB = /^https?:$/.test(location.protocol) && !/claude/.test(location.hostname);
    const BASE_URL = ON_WEB ? location.origin + location.pathname : ARTIFACT_URL;

    const key = d => `${RECEPCION ? 'recepcion' : 'revision'}_${d}`;
    function store(d, s) { try { localStorage.setItem(key(d), JSON.stringify(s)); return true; } catch (e) { return false; } }
    function fetchState(d) {
      try {
        const raw = localStorage.getItem(key(d));
        if (raw) {
          const s = JSON.parse(raw);
          return { berths: (s.berths || []).filter(b => ORDER.has(b)), readings: s.readings || {} };
        }
      } catch (e) {}
      return { berths: [], readings: {} };
    }
    // Borra listas de más de 7 días
    function cleanup() {
      try {
        const limit = new Date(); limit.setDate(limit.getDate() - 7);
        const lim = limit.toISOString().slice(0, 10);
        Object.keys(localStorage).forEach(k => {
          const m = k.match(/^(revision|recepcion)_(\d{4}-\d{2}-\d{2})$/);
          if (m && m[2] < lim) localStorage.removeItem(k);
        });
      } catch (e) {}
    }

    function notify(msg, ms = 4000) {
      const el = document.getElementById('statusMessage');
      el.textContent = msg;
      clearTimeout(notify.t);
      notify.t = setTimeout(() => { el.textContent = ''; }, ms);
    }
    function hint(msg, isError) {
      const el = document.getElementById('addHint');
      el.textContent = msg || '';
      el.classList.toggle('error', !!isError);
    }

    const autosave = () => store(currentDate, state);
    function saveData() {
      if (store(currentDate, state)) notify('✓ Datos guardados');
      else notify('No se pudo guardar en este navegador');
    }

    // ---------- Añadir / quitar ----------
    const input = document.getElementById('berthInput');
    const suggBox = document.getElementById('suggestions');

    function addBerth(code) {
      if (state.berths.includes(code)) { hint(`${code} ya está en la lista`, true); return; }
      state.berths.push(code);
      state.berths.sort((a, b) => ORDER.get(a) - ORDER.get(b));
      if (!state.readings[code]) state.readings[code] = { light: '', water: '', occupied: false };
      autosave();
      input.value = '';
      suggBox.innerHTML = '';
      hint(`✓ ${code} añadido`);
      render();
      const card = document.getElementById(`card_${cssId(code)}`);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function removeBerth(code) {
      state.berths = state.berths.filter(b => b !== code);
      delete state.readings[code];
      autosave();
      render();
      notify(`${code} quitado`);
    }

    function renderSuggestions() {
      const q = input.value;
      suggBox.innerHTML = '';
      if (!compact(q)) { hint(''); return; }
      const list = suggest(q);
      if (!list.length) { hint(`"${q.toUpperCase()}" no existe en el puerto`, true); return; }
      hint('');
      list.forEach(b => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sugg';
        btn.textContent = b;
        if (state.berths.includes(b)) { btn.disabled = true; btn.title = 'Ya añadido'; }
        btn.onclick = () => { addBerth(b); input.focus(); };
        suggBox.appendChild(btn);
      });
    }
    input.addEventListener('input', renderSuggestions);

    document.getElementById('addForm').addEventListener('submit', e => {
      e.preventDefault();
      const q = input.value;
      if (!compact(q)) return;
      const exact = canonical(q);
      if (exact) { addBerth(exact); return; }
      const list = suggest(q).filter(b => !state.berths.includes(b));
      if (list.length === 1) { addBerth(list[0]); return; }
      if (list.length > 1) { hint('Hay varios amarres posibles: toca el correcto', true); return; }
      hint(`"${q.toUpperCase()}" no existe en el puerto`, true);
    });

    // ---------- Pintar la lista ----------
    const cssId = b => b.replace(/\s+/g, '_');

    function render() {
      const list = document.getElementById('berthList');
      list.innerHTML = '';
      const n = state.berths.length;
      document.getElementById('emptyState').hidden = n > 0;
      document.getElementById('listHead').hidden = n === 0;
      document.getElementById('berthCount').textContent = `${n} ${n === 1 ? 'amarre' : 'amarres'}`;
      document.getElementById('sendPanel').hidden = true;

      state.berths.forEach(berth => {
        const r = state.readings[berth] || (state.readings[berth] = { light: '', water: '', occupied: false });
        const card = document.createElement('div');
        card.className = 'berth-card';
        card.id = `card_${cssId(berth)}`;

        const top = document.createElement('div');
        top.className = 'berth-top';
        const name = document.createElement('div');
        name.className = 'berth-name';
        name.textContent = berth;
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'remove-btn';
        rm.textContent = 'Quitar';
        rm.onclick = () => {
          if (rm.classList.contains('confirm')) { removeBerth(berth); return; }
          rm.classList.add('confirm');
          rm.textContent = '¿Seguro?';
          setTimeout(() => { rm.classList.remove('confirm'); rm.textContent = 'Quitar'; }, 3000);
        };
        top.append(name, rm);
        card.appendChild(top);
        if (RECEPCION) { top.style.marginBottom = '0'; list.appendChild(card); return; }

        const statusButtons = document.createElement('div');
        statusButtons.className = 'status-buttons';
        const occ = document.createElement('button');
        occ.type = 'button';
        occ.className = 'status-btn' + (r.occupied ? ' active' : '');
        occ.textContent = 'Ocupado';
        occ.onclick = () => { r.occupied = !r.occupied; occ.classList.toggle('active', r.occupied); autosave(); };
        statusButtons.appendChild(occ);
        card.appendChild(statusButtons);

        const group = document.createElement('div');
        group.className = 'input-group';
        [['Luz', 'light'], ['Agua', 'water']].forEach(([label, k]) => {
          const l = document.createElement('label');
          l.className = 'field-label';
          l.textContent = label;
          l.htmlFor = `${k}_${cssId(berth)}`;
          group.appendChild(l);
        });
        [['light'], ['water']].forEach(([k]) => {
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.inputMode = 'decimal';
          inp.className = 'field-input';
          inp.id = `${k}_${cssId(berth)}`;
          inp.placeholder = '0.000';
          inp.value = r[k] || '';
          inp.addEventListener('input', () => { r[k] = inp.value.trim(); autosave(); });
          group.appendChild(inp);
        });
        card.appendChild(group);
        list.appendChild(card);
      });
    }

    dateInput.addEventListener('change', () => {
      autosave();
      if (!dateInput.value) { dateInput.value = currentDate; return; }
      currentDate = dateInput.value;
      state = fetchState(currentDate);
      render();
      renderSuggestions();
    });

    // ---------- PDF ----------
    function formatDate(iso) {
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    function buildPdf() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const W = doc.internal.pageSize.getWidth();
      let y = 18;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('Revisión de Contadores', W / 2, y, { align: 'center' });
      y += 10;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(12);
      doc.text(`Fecha de lectura: ${formatDate(currentDate)}`, 14, y);
      y += 4;

      const rows = state.berths.map(b => {
        const r = state.readings[b] || {};
        return [b, r.occupied ? 'Sí' : 'No', r.light || '0', r.water || '0'];
      });
      doc.autoTable({
        startY: y + 4,
        head: [['Amarre', 'Ocupado', 'Luz', 'Agua']],
        body: rows,
        theme: 'grid',
        styles: { fontSize: 10, cellPadding: 2 },
        headStyles: { fillColor: [60, 70, 85], textColor: 255 },
        columnStyles: {
          0: { cellWidth: 34 },
          1: { cellWidth: 34, halign: 'center' },
          2: { cellWidth: 57, halign: 'right' },
          3: { cellWidth: 57, halign: 'right' }
        },
        didParseCell: (d) => {
          if (d.section === 'head') d.cell.styles.halign = ['left', 'center', 'right', 'right'][d.column.index];
        },
        margin: { left: 14, right: 14 }
      });

      const pages = doc.getNumberOfPages();
      doc.setFontSize(9);
      for (let i = 1; i <= pages; i++) {
        doc.setPage(i);
        doc.text(`Página ${i} de ${pages}`, W - 14, 290, { align: 'right' });
      }
      return doc.output('blob');
    }

    // Orden: 1) menú de compartir del móvil; 2) capacidad "downloads" de Claude; 3) descarga normal.
    async function deliverPdf(blob, filename) {
      const file = new File([blob], filename, { type: 'application/pdf' });
      let why = '';
      if (!navigator.share || !navigator.canShare) {
        why = 'no está disponible en este navegador';
      } else if (!navigator.canShare({ files: [file] })) {
        why = 'no admite compartir archivos aquí';
      } else {
        try {
          await navigator.share({ files: [file], title: filename });
          return { via: 'shared' };
        } catch (e) {
          if (e && e.name === 'AbortError') return { via: 'declined' };
          why = (e && e.name === 'NotAllowedError') ? 'está bloqueado en este entorno' : `falló (${e && e.name})`;
        }
      }
      try {
        const dl = window.claude && await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data: blob }); return { via: 'saved', why }; }
      } catch (e) {
        if (e && e.code === 'declined') return { via: 'declined' };
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      return { via: 'downloaded', why };
    }

    async function createPdf() {
      if (!(window.jspdf && window.jspdf.jsPDF)) { notify('No se pudo cargar el generador de PDF. Comprueba la conexión.'); return; }
      if (!state.berths.length) { notify('Añade al menos un amarre para crear el PDF'); return; }
      autosave();
      try {
        const blob = buildPdf();
        const r = await deliverPdf(blob, `Revision_Contadores_${currentDate}.pdf`);
        if (r.via === 'shared') notify('✓ PDF listo para compartir');
        else if (r.via !== 'declined') notify(`PDF guardado en el móvil. El menú de compartir ${r.why}.`, 9000);
      } catch (e) {
        notify('Error al crear el PDF');
        console.error(e);
      }
    }

    document.getElementById('pdfBtn').addEventListener('click', createPdf);
    document.getElementById('saveBtn').addEventListener('click', saveData);

    // ---------- Recepción: preparar y enviar la lista ----------
    function listLink() {
      const code = currentDate.replace(/-/g, '') + '-' + state.berths.map(compact).join('-');
      if (!ON_WEB) return `${BASE_URL}#r-${code}`;
      const note = document.getElementById('sendNote').value.trim();
      return `${BASE_URL}?lista=${code}` + (note ? `&nota=${encodeURIComponent(note)}` : '');
    }
    const mailSubject = () => `Revisión de contadores ${formatDate(currentDate)}: ${state.berths.join(', ')}`;
    function buildMessage() {
      const note = document.getElementById('sendNote').value.trim();
      return `Amarres para revisar contadores (${formatDate(currentDate)}):\n` +
        `${state.berths.join(', ')}\n` +
        (note ? `\n${note}\n` : '') +
        `\nAbre este enlace y se cargan solos en la app:\n${listLink()}`;
    }
    const updatePreview = () => { document.getElementById('sendPreview').textContent = buildMessage(); };
    document.getElementById('sendNote').addEventListener('input', updatePreview);

    // Email del marinero: se recuerda en este ordenador
    const mailInput = document.getElementById('mailTo');
    try { mailInput.value = localStorage.getItem('revision_mailTo') || ''; } catch (e) {}
    mailInput.addEventListener('input', () => { try { localStorage.setItem('revision_mailTo', mailInput.value.trim()); } catch (e) {} });

    document.getElementById('mailBtn').addEventListener('click', () => {
      const to = mailInput.value.trim();
      location.href = `mailto:${encodeURIComponent(to).replace(/%40/g, '@')}` +
        `?subject=${encodeURIComponent(mailSubject())}&body=${encodeURIComponent(buildMessage())}`;
      notify('Si no se abre el correo, usa "Abrir en Gmail" o "Copiar mensaje"', 8000);
    });

    document.getElementById('gmailBtn').addEventListener('click', () => {
      const url = 'https://mail.google.com/mail/?view=cm&fs=1' +
        `&to=${encodeURIComponent(mailInput.value.trim())}` +
        `&su=${encodeURIComponent(mailSubject())}&body=${encodeURIComponent(buildMessage())}`;
      const w = window.open(url, '_blank');
      if (!w) location.href = url;
    });

    document.getElementById('waBtn').addEventListener('click', () => {
      const url = 'https://wa.me/?text=' + encodeURIComponent(buildMessage());
      const w = window.open(url, '_blank');
      if (!w) location.href = url;
    });

    document.getElementById('sendBtn').addEventListener('click', () => {
      if (!state.berths.length) { notify('Añade al menos un amarre antes de enviar'); return; }
      updatePreview();
      document.getElementById('shareBtn').hidden = !navigator.share;
      const panel = document.getElementById('sendPanel');
      panel.hidden = false;
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const msg = buildMessage();
      const fallback = () => {
        const r = document.createRange(); r.selectNodeContents(document.getElementById('sendPreview'));
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        notify('Texto seleccionado: cópialo con el menú del móvil');
      };
      try {
        navigator.clipboard.writeText(msg).then(() => notify('✓ Mensaje copiado'), fallback);
      } catch (e) { fallback(); }
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      try { await navigator.share({ text: buildMessage() }); }
      catch (e) { if (!e || e.name !== 'AbortError') notify('No se pudo abrir el menú de compartir. Usa WhatsApp o Copiar.'); }
    });

    // ---------- Marinero: cargar la lista que llega en el enlace ----------
    function importFromHash() {
      // Acepta ?lista=20261018-F07-H29B y el formato antiguo #r-20261018-F07.H29B
      let raw = null;
      try { raw = new URLSearchParams(location.search).get('lista'); } catch (e) {}
      if (!raw) { const h = location.hash.match(/^#r-(.+)$/); if (h) raw = h[1]; }
      if (!raw) return false;
      const m = decodeURIComponent(raw).trim().match(/^(\d{4})(\d{2})(\d{2})[-.]([A-Za-z0-9.\- ]+)$/);
      const banner = document.getElementById('importBanner');
      if (!m) {
        banner.textContent = 'El enlace de recepción está incompleto o dañado. Pide que te lo vuelvan a enviar.';
        banner.hidden = false;
        try { history.replaceState(null, '', location.pathname); } catch (e) {}
        return false;
      }
      const date = `${m[1]}-${m[2]}-${m[3]}`;
      const codes = m[4].split(/[.\- ]+/).filter(Boolean);
      const valid = [], unknown = [];
      codes.forEach(c => { const b = BY_COMPACT.get(c.toUpperCase()); (b ? valid : unknown).push(b || c); });

      currentDate = date;
      dateInput.value = date;
      state = fetchState(date);
      let added = 0;
      valid.forEach(b => {
        if (state.berths.includes(b)) return;
        state.berths.push(b);
        state.readings[b] = state.readings[b] || { light: '', water: '', occupied: false };
        added++;
      });
      state.berths.sort((a, b) => ORDER.get(a) - ORDER.get(b));
      autosave();

      let txt = `Lista de recepción (${formatDate(date)}): ${valid.join(', ') || 'ningún amarre válido'}. `;
      txt += added ? `${added} ${added === 1 ? 'amarre nuevo añadido' : 'amarres nuevos añadidos'}.` : 'Ya los tenías todos.';
      if (unknown.length) txt += ` Códigos no reconocidos: ${unknown.join(', ')}.`;
      banner.textContent = txt;
      let nota = null;
      try { nota = new URLSearchParams(location.search).get('nota'); } catch (e) {}
      if (nota && nota.trim()) {
        const n = document.createElement('div');
        n.className = 'import-note';
        n.textContent = `Nota de recepción: ${nota.trim()}`;
        banner.appendChild(n);
        try { localStorage.setItem(`revision_nota_${date}`, nota.trim()); } catch (e) {}
      }
      banner.hidden = false;

      // Quita el código del enlace para que al recargar no se vuelva a aplicar
      try { history.replaceState(null, '', location.pathname); } catch (e) {}
      return true;
    }

    function applyMode() {
      document.getElementById('modeBar').hidden = !RECEPCION;
      document.getElementById('pdfBtn').hidden = RECEPCION;
      document.getElementById('saveBtn').hidden = RECEPCION;
      document.getElementById('sendBtn').hidden = !RECEPCION;
      document.getElementById('emptyState').textContent = RECEPCION
        ? 'Escribe los amarres que hay que revisar y pulsa Enviar lista.'
        : 'Todavía no hay amarres. Escribe el código del amarre que pide recepción y pulsa Añadir.';
    }

    function boot() {
      RECEPCION = location.hash === '#recepcion';
      document.getElementById('importBanner').hidden = true;
      applyMode();
      if (RECEPCION || !importFromHash()) state = fetchState(currentDate);
      render();
    }
    window.addEventListener('hashchange', boot);

    cleanup();
    boot();
  </script>

</body>
